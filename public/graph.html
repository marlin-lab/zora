<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关系图谱 · 清溯 Zora</title>
<style>
:root{
  --parchment:#fefffc; --paper:#fff; --linen:#f9faf7;
  --graphite:#2c2c2c; --charcoal:#444141; --ash:#646464; --fog:#b4b8b4;
  --mist:#dee2de; --blue:#41a1cf; --cerulean:#0081c0; --twilight:#282834; --dusk:#1f1f29;
  --serif:Georgia,"Times New Roman","Songti SC","STZhongsong","SimSun",serif;
  --sans:"Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--parchment);color:var(--charcoal);font-family:var(--sans);overflow:hidden}

/* ---------- 左侧栏（与首页同一套） ---------- */
:root{ --navw:226px; }
.sidenav{
  position:fixed;left:0;top:0;bottom:0;width:var(--navw);z-index:60;
  background:var(--parchment);border-right:1px solid var(--mist);
  display:flex;flex-direction:column;padding:30px 18px 22px;
}
.snBrand{font-family:var(--serif);font-size:19px;letter-spacing:-.02em;color:var(--graphite);line-height:1.35}
.snBrand em{display:block;font-style:normal;font-family:var(--sans);font-size:10.5px;
  letter-spacing:.16em;color:var(--fog);margin-top:5px}
.snLinks{display:flex;flex-direction:column;gap:2px;margin-top:36px}
.snLinks a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:7px;
  font-size:14px;color:var(--ash);text-decoration:none;transition:background .18s,color .18s}
.snLinks a i{font-style:normal;font-size:10.5px;letter-spacing:.08em;color:var(--fog);min-width:18px}
.snLinks a:hover{background:rgba(65,161,207,.07);color:var(--charcoal)}
.snLinks a.on{background:rgba(65,161,207,.09);color:var(--cerulean)}
.snLinks a.on i{color:var(--cerulean)}
.snFoot{margin-top:auto;padding-top:16px;border-top:1px solid var(--mist);
  display:flex;flex-direction:column;gap:8px}
.snFoot a,.snFoot button{background:none;border:0;padding:0;text-align:left;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;color:var(--ash)}
.snFoot a:hover,.snFoot button:hover{color:var(--cerulean)}
.snMask{position:fixed;inset:0;background:rgba(28,32,28,.28);z-index:55;opacity:0;
  pointer-events:none;transition:opacity .25s}
.snMask.on{opacity:1;pointer-events:auto}
.snTop{display:none;position:fixed;top:0;left:0;right:0;height:54px;z-index:70;
  align-items:center;gap:10px;padding:0 14px;background:var(--parchment);
  border-bottom:1px solid var(--mist)}
.snTop button{background:none;border:0;font-size:19px;line-height:1;cursor:pointer;color:var(--charcoal);padding:6px}
.snTop .t{font-family:var(--serif);font-size:17px;color:var(--graphite);flex:1}
.snTop #snSea{font-family:var(--sans);font-size:12.5px;color:var(--cerulean);
  border:1px solid var(--blue);border-radius:6px;padding:5px 11px;min-height:30px}
@media(min-width:1000px){ body{padding-left:var(--navw)} .title{left:calc(var(--navw) + 34px)} }
@media(max-width:999px){
  .snTop{display:flex}
  .sidenav{transform:translateX(-102%);width:82%;max-width:290px;box-shadow:16px 0 44px rgba(28,32,28,.16)}
  .sidenav.open{transform:none}
  body{padding-top:54px}
}

.title{position:fixed;left:34px;top:88px;z-index:20;pointer-events:none;max-width:min(400px,40vw)}
.title h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.06;letter-spacing:-.02em;
  color:var(--graphite);margin:0 0 8px}
.title .meta{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.title p{font-size:14px;line-height:1.65;color:var(--ash);margin:10px 0 0}

.tools{position:fixed;left:calc(var(--navw) + 34px);bottom:22px;top:auto;right:auto;z-index:20;width:238px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--mist);
  border-radius:8px;padding:9px 12px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 4px 5px rgba(0,0,0,.05)}
.sbox input{flex:1;border:0;outline:none;background:transparent;font-family:var(--sans);font-size:14px;color:var(--graphite)}
.sbox input::placeholder{color:var(--fog)}
.sbox svg{width:14px;height:14px;stroke:var(--fog);fill:none;stroke-width:1.6}
.hits{margin-top:10px;background:var(--paper);border:1px solid var(--mist);border-radius:8px;
  max-height:42vh;overflow:auto;display:none;box-shadow:0 1px 1px rgba(0,0,0,.08),0 4px 5px rgba(0,0,0,.05)}
.hits.on{display:block}
.hrow{padding:8px 12px;border-top:1px solid var(--mist);cursor:pointer;font-size:13px;color:var(--charcoal)}
.hrow:first-child{border-top:0}
.hrow:hover{color:var(--cerulean)}
.legend{margin-top:14px;font-size:12px;line-height:1.95;color:var(--fog)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8b909c;margin-right:7px;vertical-align:1px}
.legend i.b{background:var(--blue)}
.legend i.g{width:11px;height:11px;background:#8b909c}
.legend a{color:var(--ash);text-decoration:none;border-bottom:1px solid var(--mist);font-size:12px}

canvas{display:block;width:100%;height:100%;cursor:grab;position:relative;z-index:1}
canvas.grab{cursor:grabbing}

.hud{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dusk);color:#fff;
  font-size:12.5px;padding:9px 18px;border-radius:50px;z-index:30;opacity:.92}
.panel{position:fixed;right:30px;bottom:76px;z-index:20;background:var(--paper);border:1px solid var(--mist);
  border-radius:12px;padding:14px 16px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 4px 5px rgba(0,0,0,.05);
  max-width:300px;display:none}
.panel.on{display:block}
.panel .pt{font-family:var(--serif);font-size:20px;color:var(--graphite);margin-bottom:4px;line-height:1.2}
.panel .ps{font-size:12.5px;color:var(--fog);letter-spacing:.04em;margin-bottom:10px}
.panel a{font-size:13.5px;color:var(--blue);text-decoration:none;border-bottom:1px solid transparent}
.panel a:hover{border-color:var(--blue)}
@media(max-width:820px){
  .title{display:none}
  .tools{left:16px;bottom:16px;width:200px}
  .panel{right:16px;bottom:16px;left:16px;max-width:none}
  .legend{display:none}
}
</style>
</head>
<body>

<aside class="sidenav" id="sidenav">
  <div class="snBrand">清溯 Zora<em>PERSONAL OS</em></div>
  <nav class="snLinks">
    <a href="/#dash"><i>01</i>数据</a>
    <a href="/#repo"><i>02</i>仓库</a>
  </nav>
  <div class="snFoot">
    <a href="/classic.html?view=graph">经典视图</a>
    <a href="/classic.html">编辑视图</a>
    <button type="button" id="toTop">↑ 回到首页</button>
  </div>
</aside>
<div class="snMask" id="snMask"></div>
<div class="snTop">
  <button type="button" id="snToggle" aria-label="打开导航">☰</button>
  <span class="t">关系图谱</span>
  <button type="button" id="snSea">首页</button>
</div>

<!-- 左上标题已移入左侧栏，画布区不再压字 -->

<div class="tools">
  <div class="legend">
    <i class="g"></i>点越大 = 链接越多<br>
    <i class="b"></i>悬停：自己变蓝放大，邻居亮<br>
    原版 Obsidian 式视图：<a href="/classic.html?view=graph">进经典界面看</a>
  </div>
</div>

<div class="panel" id="panel">
  <div class="pt" id="pTitle"></div>
  <div class="ps" id="pMeta"></div>
  <a id="pOpen" href="#">打开这篇 →</a>
</div>

<canvas id="cv"></canvas>
<div class="hud">拖节点 · 拖背景平移 · 滚轮缩放 · 单击打开文章</div>

<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var nodes=[], edges=[], byId=[], W=0, H=0, DPR=Math.min(2,window.devicePixelRatio||1);
var view={x:0,y:0,k:1, tk:1, ax:0, ay:0, wx:0, wy:0};
var alpha=1, hoverId=null, selId=null, dragId=null, panning=false, moved=0, mx=0, my=0;
var HUB=-1, qhit=null, hoverAmt=0, firstFit=true;

var C={parch:'#fefffc',dot:'#8b909c',hot:'#41a1cf',near:'#2b7fa6',
       line:'120,126,140', lineHot:'65,161,207',
       label:'#5c6070', ash:'#646464'};

function resize(){
  var NAVW = window.innerWidth >= 1000 ? 226 : 0;
  W=window.innerWidth-NAVW;
  H=window.innerHeight-(NAVW?0:54);
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  view.ax=W/2; view.ay=H/2;
}
window.addEventListener('resize',function(){ resize(); },{passive:true});
resize();

function tip(msg){
  var h=document.querySelector('.hud'); if(!h) return;
  h.textContent=msg; clearTimeout(tip._t);
  tip._t=setTimeout(function(){ h.textContent='拖节点 · 拖背景平移 · 滚轮缩放 · 单击打开文章'; },2200);
}

fetch('/api/graph').then(function(r){return r.json();}).then(function(g){
  var raw=g.nodes||[], re=g.edges||[];
  var gm=document.getElementById('gmeta');
  if(gm) gm.textContent=raw.length+' NODES · '+re.length+' EDGES';
  var deg={};
  re.forEach(function(e){ deg[e.s]=(deg[e.s]||0)+1; deg[e.t]=(deg[e.t]||0)+1; });
  /* 起点挤在中心附近 —— 打开后自己"炸开"，这就是 Obsidian 的冷凝入场 */
  nodes=raw.map(function(n,i){
    var a=(i/Math.max(1,raw.length))*Math.PI*2, r=34+(i%7)*9;
    return {id:n.id, title:n.title, path:n.path, deg:deg[n.id]||0,
      x:Math.cos(a)*r, y:Math.sin(a)*r, vx:0, vy:0,
      r:4, o:0.9, ro:0.9};
  });
  byId=nodes;
  edges=re.map(function(e){ return {s:e.s, t:e.t, a:0}; }).filter(function(e){
    return byId[e.s] && byId[e.t];
  });
  nodes.forEach(function(n){ if(n.deg>0 && (HUB<0 || n.deg>nodes[HUB].deg)) HUB=nodes.indexOf(n); });
  /* 首次冷凝：先快速凝聚到平衡，再让 alpha 保持高一点，开场还能看到轻微扩散 */
  for(var wi=0;wi<84;wi++) tick(1.0);
  fitView(); alpha=0.62;
  loop();
}).catch(function(){ tip('图谱数据读不到，服务在跑吗？'); });

/* ---------- 力学（持续活着，永不冻结） ---------- */
function tick(a){
  var i,j,p,q,dx,dy,d2,d,f,dist;
  a = a===undefined ? alpha : a;
  for(i=0;i<nodes.length;i++){
    p=nodes[i];
    for(j=i+1;j<nodes.length;j++){
      q=nodes[j];
      dx=q.x-p.x; dy=q.y-p.y; d2=dx*dx+dy*dy;
      if(d2>260000) continue;
      if(d2<1){ d2=1; dx=Math.random()-.5; dy=Math.random()-.5; }
      d=Math.sqrt(d2); f=(2400*a)/d2;
      dx/=d; dy/=d;
      p.vx-=dx*f; p.vy-=dy*f; q.vx+=dx*f; q.vy+=dy*f;
      if(d<66){ p.vx-=dx*(66-d)*.30; p.vy-=dy*(66-d)*.30; q.vx+=dx*(66-d)*.30; q.vy+=dy*(66-d)*.30; }
    }
    p.vx += (0-p.x)*0.0038*a;
    p.vy += (0-p.y)*0.0038*a;
  }
  for(i=0;i<edges.length;i++){
    var e=edges[i], s=byId[e.s], t=byId[e.t];
    dx=t.x-s.x; dy=t.y-s.y; dist=Math.sqrt(dx*dx+dy*dy)||1;
    f=(dist-112)*0.016*a;
    dx/=dist; dy/=dist;
    s.vx+=dx*f; s.vy+=dy*f; t.vx-=dx*f; t.vy-=dy*f;
  }
  for(i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.id===dragId){ n.vx=0; n.vy=0; continue; }
    n.vx*=0.88; n.vy*=0.88;
    n.vx+=(Math.random()-.5)*0.05;
    n.vy+=(Math.random()-.5)*0.05;
    n.x+=Math.max(-16,Math.min(16,n.vx));
    n.y+=Math.max(-16,Math.min(16,n.vy));
  }
  /* 收敛后仍在轻微漂移，跟 Obsidian 一样"活着" */
  alpha=Math.max(0.30, alpha*0.996);
}

function baseR(n){ return 4.0+Math.min(8,n.deg*1.35); }
function toScreen(n){ return {x:n.x*view.k+view.x, y:n.y*view.k+view.y}; }
function toWorld(sx,sy){ return {x:(sx-view.x)/view.k, y:(sy-view.y)/view.k}; }

function fitView(){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(function(n){ x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); });
  var bw=Math.max(40,x1-x0), bh=Math.max(40,y1-y0);
  var k=Math.min(1.5, Math.max(.06, Math.min((W*0.66)/bw, (H*0.76)/bh)));
  view.k=k; view.tk=k;
  view.x=(W*0.55)-((x0+x1)/2)*k;
  view.y=(H*0.55)-((y0+y1)/2)*k;
  view.ax=W/2; view.ay=H/2;
  view.wx=(view.ax-view.x)/k; view.wy=(view.ay-view.y)/k;
}

/* ---------- 每帧：物理 + 视觉缓动 + 绘制 ---------- */
function loop(){
  tick();
  // 缩放缓动（围绕鼠标锚点）
  if(Math.abs(view.k-view.tk)>0.0008){
    view.k += (view.tk-view.k)*0.16;
    view.x = view.ax - view.wx*view.k;
    view.y = view.ay - view.wy*view.k;
  } else { view.k = view.tk; }
  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.fillStyle=C.parch; ctx.fillRect(0,0,W,H);

  var act = selId!==null ? selId : hoverId;
  var neigh = {};
  if(act!==null) edges.forEach(function(e){ if(e.s===act) neigh[e.t]=1; if(e.t===act) neigh[e.s]=1; });
  hoverAmt += ((act!==null?1:0)-hoverAmt)*0.14;   // 全局悬停强度平滑

  // 边：alpha 平滑，邻居连边发光
  for(var i=0;i<edges.length;i++){
    var e=edges[i], a=toScreen(byId[e.s]), b=toScreen(byId[e.t]);
    var hot = act!==null && (e.s===act||e.t===act);
    e.a += ((hot?1:0)-e.a)*0.16;
    var base = 0.26 + 0.04*Math.sin((Date.now()/2600)+e.s);   // 极轻微脉动
    ctx.strokeStyle = 'rgba('+(hot?C.lineHot:C.line)+','+(base+e.a*0.55).toFixed(3)+')';
    ctx.lineWidth = 1 + e.a*0.9;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }

  // 节点 + 标签
  var fs = Math.max(10.5, Math.min(14, 11.5*Math.max(.95,Math.min(1.28,view.k))));
  var boxes = [];
  /* 先画度数高的节点标签，保证 me / STUDY 一定有自己的名字 */
  var order = nodes.map(function(n,ix){ return ix; }).sort(function(a,b){ return nodes[b].deg-nodes[a].deg; });
  for(var oi=0;oi<order.length;oi++){
    var k=order[oi];
    var n=nodes[k], p=toScreen(n);
    var hit = qhit && n.title.toLowerCase().indexOf(qhit)>=0;
    var isAct = n.id===act;
    var isNear = !!neigh[n.id];
    var dim = ((act!==null && !isAct && !isNear) || (qhit && !hit)) ? 1 : 0;
    var tr = baseR(n)*(isAct?1.85:isNear?1.12:1)*Math.max(.85,Math.min(1.25,view.k));
    var to = dim ? 0.22 : 1;
    n.r += (tr-n.r)*0.16;
    n.o += (to-n.o)*0.12;
    n.ro += (to-n.ro)*0.10;

    if(p.x<-140||p.x>W+140||p.y<-100||p.y>H+100) continue;

    // 悬停光晕
    if(isAct){
      ctx.beginPath(); ctx.arc(p.x,p.y,n.r+7,0,6.2832);
      ctx.fillStyle='rgba(65,161,207,'+(0.10*hoverAmt).toFixed(3)+')';
      ctx.fill();
    }
    ctx.globalAlpha = n.o;
    ctx.beginPath(); ctx.arc(p.x,p.y,n.r,0,6.2832);
    ctx.fillStyle = isAct ? C.hot : hit ? C.near : C.dot;
    ctx.fill();
    if(isAct){ ctx.strokeStyle='rgba(65,161,207,.55)'; ctx.lineWidth=1; ctx.stroke(); }

    // 标签：悬停放大变蓝，邻居加深，其余淡出
    var lf = fs*(isAct?1.12:1);
    ctx.font='400 '+lf+'px Georgia, "Songti SC", "SimSun", serif';
    ctx.fillStyle = (isAct||hit) ? C.hot : isNear ? '#41454f' : C.label;
    ctx.globalAlpha = n.ro;
    ctx.textAlign='center';
    var lab = n.title.length>18 ? n.title.slice(0,18)+'…' : n.title;
    var ly = p.y + n.r + lf + 3;
    var wd = lab.length*lf*0.62, hh = lf*0.95;
    /* 标签避让：撞了就下移一行，再撞就这次不画（悬停时仍会出来） */
    var clash=false;
    for(var t2=0;t2<2;t2++){
      clash=false;
      for(var bi=0;bi<boxes.length;bi++){
        var bx=boxes[bi];
        if(p.x-wd/2 < bx.x+bx.w/2 && p.x+wd/2 > bx.x-bx.w/2 && ly-hh < bx.y+bx.h/2 && ly+hh > bx.y-bx.h/2){ clash=true; break; }
      }
      if(!clash) break;
      ly += lf+2;
    }
    if(clash && !isAct){ ctx.globalAlpha = 1; continue; }
    boxes.push({x:p.x,y:ly,w:wd,h:hh});
    ctx.fillText(lab, p.x, ly);
    ctx.globalAlpha = 1;
  }
}

/* ---------- 交互 ---------- */
function hitNode(sx,sy){
  var p=toWorld(sx,sy), best=null, bd=1e9;
  for(var i=nodes.length-1;i>=0;i--){
    var n=nodes[i], dx=p.x-n.x, dy=p.y-n.y;
    var d=dx*dx+dy*dy, rr=Math.pow(baseR(n)+8/view.k,2);
    if(d<rr && d<bd){ bd=d; best=n; }
  }
  return best;
}
cv.addEventListener('mousedown',function(e){
  var r=cv.getBoundingClientRect();
  mx=e.clientX-r.left; my=e.clientY-r.top; moved=0;
  var n=hitNode(mx,my);
  if(n){ dragId=n.id; alpha=Math.max(alpha,0.85); }
  else { panning=true; cv.classList.add('grab'); }
});
window.addEventListener('mousemove',function(e){
  var r=cv.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
  if(dragId!==null){
    var n=nodes.filter(function(x){return x.id===dragId;})[0];
    if(n){
      var p=toWorld(sx,sy);
      /* 甩出去的惯性：拖的时候给节点留一点速度 */
      n.vx=(p.x-n.x)*0.55; n.vy=(p.y-n.y)*0.55;
      n.x=p.x; n.y=p.y;
    }
    moved+=Math.abs(sx-mx)+Math.abs(sy-my); mx=sx; my=sy;
  } else if(panning){
    view.x+=sx-mx; view.y+=sy-my;
    moved+=Math.abs(sx-mx)+Math.abs(sy-my); mx=sx; my=sy;
    view.ax=W/2; view.ay=H/2;
    view.wx=(view.ax-view.x)/view.k; view.wy=(view.ay-view.y)/view.k;
  } else {
    var h=hitNode(sx,sy);
    var id=h?h.id:null;
    if(id!==hoverId){ hoverId=id; cv.style.cursor = h ? 'pointer' : 'grab'; }
  }
});
window.addEventListener('mouseup',function(e){
  if(dragId!==null && moved<6){
    var n=nodes.filter(function(x){return x.id===dragId;})[0];
    if(n) location.href='/classic.html?path='+encodeURIComponent(n.path||'')+'&from=repo';
  } else if(dragId===null && !panning && moved<6){
    var r=cv.getBoundingClientRect();
    var h=hitNode(e.clientX-r.left, e.clientY-r.top);
    if(h){ selId=h.id; showPanel(h); } else { selId=null; document.getElementById('panel').classList.remove('on'); }
  }
  dragId=null; panning=false; moved=0; cv.classList.remove('grab');
  alpha=Math.max(alpha,0.55);
});
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
  /* 记录缩放锚点，交给每帧缓动去逼近 —— 手感是滑的，不是一跳 */
  view.ax=sx; view.ay=sy;
  view.wx=(sx-view.x)/view.k; view.wy=(sy-view.y)/view.k;
  view.tk=Math.min(3,Math.max(.22, view.tk*(e.deltaY<0?1.14:0.88)));
},{passive:false});

function showPanel(n){
  var p=document.getElementById('panel');
  document.getElementById('pTitle').textContent=n.title;
  document.getElementById('pMeta').textContent=(n.deg? n.deg+' 条双链':'孤立节点 · 还没人链到它');
  document.getElementById('pOpen').href='/classic.html?path='+encodeURIComponent(n.path||'');
  p.classList.add('on');
}

/* ---------- 节点搜索已移除 ---------- */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  var p=document.getElementById('panel');
  var had = selId || (p && p.classList.contains('on'));
  selId=null; qhit=null;
  if(p) p.classList.remove('on');
  if(!had) location.href='/#dash';   // 没有可关的，就把 Esc 当返回
});

/* 悬停/拖拽的动效都在 loop 里平滑过渡，这里不用额外动画 */
})();
/* 左侧栏抽屉（手机） */
(function(){
  var sn=document.getElementById('sidenav'), mk=document.getElementById('snMask');
  function drawer(v){
    if(!sn) return;
    sn.classList.toggle('open',v);
    if(mk) mk.classList.toggle('on',v);
    var t=document.getElementById('snToggle');
    if(t) t.textContent=v?'✕':'☰';
  }
  if(document.getElementById('snToggle')) document.getElementById('snToggle').addEventListener('click',function(){
    drawer(!sn.classList.contains('open'));
  });
  if(mk) mk.addEventListener('click',function(){drawer(false);});
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') drawer(false); });
})();</script>
